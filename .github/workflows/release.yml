name: Build and Release Plugin

on:
  release:
    types: [published]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Create ZIP archive
        run: |
          # Create a temporary directory for the release assets
          mkdir -p release-assets
          
          # Copy necessary files to the temp directory
          cp dist/main.js release-assets/
          cp dist/index.html release-assets/ 2>/dev/null || true
          cp package.json release-assets/
          cp README.md release-assets/
          cp -r public release-assets/
          
          # Create the ZIP file
          cd release-assets
          zip -r ../logseq-erd-plugin.zip .
          cd ..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: logseq-erd-plugin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
